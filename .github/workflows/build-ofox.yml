name: Build OrangeFox Recovery

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/frierensaan/xiaomi_lancelot_device_tree'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'fox_14.1'
      DEVICE_PATH:
        description: 'Device Path'
        required: true
        default: 'device/xiaomi/lancelot'
      KERNEL_TREE_URL:
        description: 'Kernel Tree URL'
        required: true
        default: 'https://github.com/Jbub5/android_kernel_xiaomi_mt6768'
      KERNEL_TREE_BRANCH:
        description: 'Kernel Tree Branch'
        required: true
        default: 'lineage-21'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'lancelot'
      MAKEFILE_NAME:
        description: 'Makefile Name'
        required: true
        default: 'twrp_lancelot'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'recoveryimage'

jobs:
  build:
    name: Build OrangeFox
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg \
            gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 10G
          key: ccache-ofox-lancelot

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Sync OrangeFox source
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
          git clone https://gitlab.com/OrangeFox/sync.git ofox_sync
          cd ofox_sync
          bash orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
          cd ..
          rm -rf ofox_sync

      - name: Clone device tree
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
          git clone --depth=1 \
            -b ${{ inputs.DEVICE_TREE_BRANCH }} \
            ${{ inputs.DEVICE_TREE_URL }} \
            ./${{ inputs.DEVICE_PATH }}

      - name: Clone kernel tree
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
          git clone --depth=1 \
            -b ${{ inputs.KERNEL_TREE_BRANCH }} \
            ${{ inputs.KERNEL_TREE_URL }} \
            ./kernel/xiaomi/mt6768

      - name: Build OrangeFox
        shell: bash
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=${{ inputs.DEVICE_NAME }}
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          export LC_ALL=C
          set -e
          lunch ${{ inputs.MAKEFILE_NAME }}-eng && make clean && mka adbd ${{ inputs.BUILD_TARGET }} -j$(nproc --all) 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Check build output
        run: |
          OUT="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}"
          if ls $OUT/OrangeFox*.zip 2>/dev/null || ls $OUT/recovery.img 2>/dev/null; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
            echo "Build failed! Last 200 lines of log:"
            tail -200 ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/build.log
            exit 1
          fi

      - name: Upload to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-lancelot-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
            ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/build.log
          retention-days: 3

      - name: Create Release
        if: env.BUILD_SUCCESS == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: OrangeFox-lancelot-${{ github.run_id }}
          name: "OrangeFox | lancelot | Voltage OS A16 QPR1"
          body: |
            **Device:** Xiaomi Redmi 9 (lancelot)
            **Chipset:** MediaTek MT6768
            **Target ROM:** Voltage OS 5.3 QPR1
            **Manifest:** fox_12.1
            **Maintainer:** frieren

            > ⚠️ Unofficial build — flash at your own risk.
          files: |
            ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
            ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
